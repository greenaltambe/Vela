name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:   # a dry run: builds everything and uploads the artifacts, creates no release

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "true"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  # Windows libmpv (not in the repository): a pinned build, checksum verified. Update the three lines together; see docs/BUILDING.md.
  LIBMPV_URL: https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261021/mpv-dev-x86_64-20261021-git-e471496c56.7z
  LIBMPV_SHA256: efc719eff3dc5954b4a5efc800632808bcec01cc9034940dd14e5eb7fe9ea633
  LIBMPV_VERSION: "mpv-winbuild-cmake 20261021 (git e471496c56)"

jobs:
  version:
    name: version check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        run: |
          set -euo pipefail
          version=$(sed -n 's/^VERSION_NAME=\(.*\)$/\1/p' version.properties | tr -d '[:space:]')
          [ -n "$version" ] || { echo "VERSION_NAME missing in version.properties" >&2; exit 1; }
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version.properties (v${version}). Fix one of them." >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  android:
    name: Android APK
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Empty when the secrets are not set: the build is then UNSIGNED and named so (see androidApp/build.gradle.kts).
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build the release APK
        run: ./gradlew :androidApp:collectReleaseApk
      - name: Verify the signature (signed builds only)
        run: |
          set -euo pipefail
          apk=$(find androidApp/build/release -maxdepth 1 -name '*.apk' | head -1)
          echo "built: $apk"
          case "$apk" in
            *-unsigned.apk) echo "UNSIGNED build (no signing secrets): nothing to verify" ;;
            *)
              apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
              "$apksigner" verify --print-certs "$apk"
              ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: androidApp/build/release/*.apk
          if-no-files-found: error

  linux:
    name: Linux packages
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Packaging tools and libmpv for the smoke test
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm fakeroot xvfb libmpv2 fontconfig fonts-dejavu-core
      - name: Build .deb, .rpm and the portable tarball
        run: ./gradlew :desktopApp:packageLinux :desktopApp:portableTarball
      - name: Smoke test the unpacked portable build
        run: |
          set -euo pipefail
          mkdir smoke && tar xzf desktopApp/build/portable/*.tar.gz -C smoke
          xvfb-run -a smoke/Vela-*/bin/vela --smoke-test | tee smoke.log
          grep -q "SMOKE OK" smoke.log
      - name: Name the files
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp desktopApp/build/portable/Vela-"$VERSION"-linux-x64.tar.gz dist/
          cp desktopApp/build/linux-packages/*.deb "dist/Vela-$VERSION-linux-amd64.deb"
          cp desktopApp/build/linux-packages/*.rpm "dist/Vela-$VERSION-linux-x86_64.rpm"
          dpkg-deb -I "dist/Vela-$VERSION-linux-amd64.deb"
          rpm -qpR "dist/Vela-$VERSION-linux-x86_64.rpm"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows packages (experimental)
    needs: version
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: libmpv (pinned, checksum verified)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri $env:LIBMPV_URL -OutFile mpv-dev.7z
          $actual = (Get-FileHash -Algorithm SHA256 mpv-dev.7z).Hash.ToLower()
          if ($actual -ne $env:LIBMPV_SHA256) { throw "libmpv checksum mismatch: $actual" }
          7z x mpv-dev.7z libmpv-2.dll -odesktopApp/appResources/windows-x64
          Get-ChildItem desktopApp/appResources/windows-x64
      - name: WiX (needed by jpackage for .msi)
        shell: pwsh
        run: |
          $wix = Get-ChildItem "C:\Program Files (x86)" -Directory -Filter "WiX Toolset*" | Select-Object -First 1
          if (-not $wix) { throw "WiX Toolset not found on this runner image" }
          "$($wix.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Build the .msi and the portable zip
        run: ./gradlew :desktopApp:packageMsi :desktopApp:portableZip
      - name: Smoke test the unpacked portable build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory smoke | Out-Null
          $zip = (Get-ChildItem desktopApp/build/portable -Filter *.zip | Select-Object -First 1).FullName
          Expand-Archive $zip -DestinationPath smoke
          $exe = Get-ChildItem smoke -Recurse -Filter vela.exe | Select-Object -First 1
          $env:VELA_SMOKE_LOG = "$PWD\smoke.log"
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "--smoke-test" -Wait -PassThru
          if (Test-Path smoke.log) { Get-Content smoke.log }
          if ($p.ExitCode -ne 0) { throw "smoke test exit code $($p.ExitCode)" }
          if (-not (Select-String -Path smoke.log -Pattern "SMOKE OK" -Quiet)) { throw "no SMOKE OK line" }
      - name: Name the files
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item desktopApp/build/portable/*.zip dist/
          $msi = Get-ChildItem desktopApp/build/compose/binaries/main/msi -Filter *.msi | Select-Object -First 1
          Copy-Item $msi.FullName "dist/Vela-$($env:VERSION)-windows-x64.msi"
          "libmpv: $env:LIBMPV_VERSION from $env:LIBMPV_URL (sha256 $env:LIBMPV_SHA256)" | Out-File dist/LIBMPV-SOURCE.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  publish:
    name: draft GitHub release
    # Only a real tag creates a release; a manual run stops after the artifacts above.
    if: github.ref_type == 'tag'
    needs: [version, android, linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write       # create the draft release
      id-token: write       # build provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Collect, checksum
        run: |
          set -euo pipefail
          mkdir release
          find artifacts -type f \( -name '*.apk' -o -name '*.deb' -o -name '*.rpm' -o -name '*.msi' -o -name '*.zip' -o -name '*.tar.gz' -o -name 'LIBMPV-SOURCE.txt' \) -exec cp {} release/ \;
          (cd release && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on {print}' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "No CHANGELOG.md section for $VERSION" >&2; exit 1; }
          cat notes.md
      - name: Create the DRAFT release (the owner publishes it by hand)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          flag=""
          case "$TAG" in *-beta*|*-rc*|*-alpha*) flag="--prerelease" ;; esac
          gh release create "$TAG" release/* --draft $flag --title "Vela $TAG" --notes-file notes.md
